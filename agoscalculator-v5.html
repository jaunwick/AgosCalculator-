<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D5FA3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgosCalculator">
<title>AgosCalculator</title>
<style>
/* ── RESET & ROOT ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EAF4FB;
  --surface:#FFFFFF;
  --surface2:#F0F8FD;
  --navy:#0D5FA3;
  --navy2:#1A7FC7;
  --navy3:#2B9FE0;
  --navy-light:#6DC4EC;
  --navy-pale:#BDE4F7;
  --text:#09375E;
  --text2:#2B6A94;
  --text3:#68A8CA;
  --border:#BEE0F2;
  --success:#0B9E72;
  --danger:#D93050;
  --warn:#E07820;
  --r:16px;
  --r-sm:10px;
  --shadow:0 2px 12px rgba(13,95,163,.08);
  --shadow-lg:0 8px 32px rgba(13,95,163,.16);
}
html{background:var(--bg);height:100%}
body{
  font-family:-apple-system,'SF Pro Text','Segoe UI',Ubuntu,Cantarell,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
button{touch-action:manipulation;cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=datetime-local]{color-scheme:light}

/* ── PAGE TRANSITIONS ── */
.page{animation:fadeUp .22s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ══════════════════════════════
   HOME
══════════════════════════════ */
.home-wrap{min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.home-hero{padding:56px 28px 32px;position:relative;z-index:1}
.home-hero h1{
  font-size:38px;font-weight:800;letter-spacing:-1.5px;
  color:var(--navy);line-height:1.05;margin-bottom:6px;
}
.home-hero h1 span{color:var(--navy3)}
.home-hero p{font-size:14px;color:var(--text2);font-weight:500;letter-spacing:.2px}
.home-nav{padding:0 16px;display:flex;flex-direction:column;gap:10px;z-index:1;position:relative}
.nav-card{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;background:var(--surface);
  border-radius:var(--r);box-shadow:var(--shadow);
  border:1.5px solid transparent;
  text-align:left;width:100%;color:var(--text);
  transition:all .18s;
}
.nav-card:active{transform:scale(.98)}
.nav-card.primary{background:var(--navy);border-color:var(--navy)}
.nav-card.primary .nc-title{color:#fff}
.nav-card.primary .nc-sub{color:var(--navy-pale);opacity:.8}
.nav-card.primary .nc-icon{background:rgba(255,255,255,.15);color:#fff}
.nc-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg);color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.nc-body{flex:1}
.nc-title{font-size:16px;font-weight:700;display:block;margin-bottom:2px}
.nc-sub{font-size:12px;color:var(--text2)}
.nc-arrow{color:var(--text3);font-size:18px;font-weight:300}
.nav-card.primary .nc-arrow{color:rgba(255,255,255,.5)}

/* Recent */
.home-recent{padding:20px 20px 0;z-index:1;position:relative}
.sec-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:10px}
.recent-row{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface);border-radius:var(--r-sm);
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.rr-name{font-size:14px;font-weight:600;margin-bottom:2px}
.rr-meta{font-size:11px;color:var(--text3)}
.rr-q{font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.rr-unit{font-size:11px;color:var(--text3);text-align:right}

/* Wave footer */
.home-wave{margin-top:auto;position:relative;line-height:0;padding-top:40px}
.home-wave svg{width:100%;display:block}
.home-footer{background:var(--navy);padding:14px 20px 20px;text-align:center}
.home-footer p{font-size:11px;color:var(--navy-pale);opacity:.6;letter-spacing:.5px}

/* ══════════════════════════════
   TOPBAR
══════════════════════════════ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;background:var(--bg);
  position:sticky;top:0;z-index:20;
}
.btn-back{
  display:flex;align-items:center;gap:4px;
  color:var(--navy);font-size:15px;font-weight:600;
  padding:6px 10px;border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow);min-width:64px;
}
.btn-back svg{flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.btn-top-r{
  font-size:13px;font-weight:600;color:var(--danger);
  padding:6px 10px;border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow);min-width:64px;text-align:right;
}

/* Step pip */
.step-pips{display:flex;gap:6px;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .2s}
.pip.active{background:var(--navy);transform:scale(1.3)}
.pip.done{background:var(--navy3)}

/* ══════════════════════════════
   CONTENT WRAP
══════════════════════════════ */
.cwrap{padding:8px 16px 72px}
.cwrap h2{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--navy);margin-bottom:4px}
.cwrap .sub{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.5}

/* ══════════════════════════════
   FORM ELEMENTS
══════════════════════════════ */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:7px}
.fg .opt{text-transform:none;font-weight:400;letter-spacing:0;color:var(--text3);font-size:10px}
.inp{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:13px 14px;color:var(--text);
  font-size:15px;transition:border-color .15s;-webkit-appearance:none;
}
.inp:focus{outline:none;border-color:var(--navy3)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Weather pills */
.weather-row{display:flex;flex-wrap:wrap;gap:7px}
.w-pill{
  padding:8px 13px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:30px;font-size:12px;color:var(--text);transition:all .15s;
  white-space:nowrap;
}
.w-pill.active{border-color:var(--navy);background:var(--navy);color:#fff}

/* ══════════════════════════════
   BUTTONS
══════════════════════════════ */
.btn-primary{
  background:var(--navy);color:#fff;border-radius:var(--r);
  padding:16px 24px;font-size:15px;font-weight:700;
  width:100%;transition:all .15s;letter-spacing:.1px;
  box-shadow:0 4px 16px rgba(26,58,108,.25);
}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled,.btn-primary.off{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-secondary{
  background:var(--surface);color:var(--navy);border-radius:var(--r);
  padding:14px 24px;font-size:14px;font-weight:600;
  width:100%;border:1.5px solid var(--border);transition:all .15s;
  box-shadow:var(--shadow);margin-top:8px;
}
.btn-secondary:active{transform:scale(.98)}
.btn-add-row{
  width:100%;padding:11px;border:1.5px dashed var(--navy-pale);
  border-radius:var(--r-sm);color:var(--navy3);font-size:14px;font-weight:600;
  background:none;transition:all .15s;margin:8px 0 16px;
}
.btn-add-row:active{background:rgba(74,120,190,.05)}

/* Method selector */
.method-card{
  display:flex;align-items:flex-start;gap:16px;
  padding:18px;background:var(--surface);border-radius:var(--r);
  border:2px solid var(--border);width:100%;color:var(--text);
  margin-bottom:10px;transition:all .18s;box-shadow:var(--shadow);text-align:left;
}
.method-card.active{border-color:var(--navy);background:var(--bg)}
.method-card .mi-icon{
  font-size:26px;min-width:42px;height:42px;
  background:var(--bg);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.method-card.active .mi-icon{background:var(--navy);filter:none}
.mi-body strong{display:block;font-size:16px;font-weight:700;margin-bottom:5px}
.mi-body p{font-size:13px;color:var(--text2);line-height:1.55}

/* ══════════════════════════════
   SECTION CARDS (flow meter)
══════════════════════════════ */
.sec-card{
  background:var(--surface);border-radius:var(--r-sm);
  border:1.5px solid var(--border);margin-bottom:8px;overflow:hidden;
  box-shadow:var(--shadow);
}
.sec-card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);
}
.sec-num{
  width:24px;height:24px;border-radius:50%;background:var(--navy);
  color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sec-card-hdr span{font-size:13px;font-weight:600;color:var(--text2);flex:1;margin-left:10px}
.sec-del{color:var(--text3);font-size:16px;padding:2px 6px;transition:color .15s}
.sec-del:hover{color:var(--danger)}
.sec-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 12px}
.si-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:5px}
.s-inp{
  width:100%;background:var(--bg);border:1.5px solid var(--border);
  border-radius:8px;padding:10px 10px;color:var(--text);
  font-size:14px;-webkit-appearance:none;transition:border-color .15s;
}
.s-inp:focus{outline:none;border-color:var(--navy3)}

/* SVG wrap */
.svg-container{margin-bottom:14px}
.svg-ph{
  background:var(--surface);border:1.5px dashed var(--border);
  border-radius:var(--r-sm);padding:32px 16px;text-align:center;
  color:var(--text3);font-size:13px;line-height:1.6;
}
.svg-ph .ph-icon{font-size:28px;margin-bottom:8px;opacity:.35;display:block}

/* Sub-step pill nav */
.substep-nav{
  display:flex;background:var(--surface);border-radius:var(--r);
  overflow:hidden;margin-bottom:18px;border:1.5px solid var(--border);
  box-shadow:var(--shadow);
}
.ss-btn{
  flex:1;padding:12px 8px;font-size:13px;font-weight:700;
  color:var(--text3);text-align:center;transition:all .18s;position:relative;
}
.ss-btn.active{background:var(--navy);color:#fff}
.ss-btn.done{color:var(--navy)}

/* ══════════════════════════════
   VELOCITY CARDS
══════════════════════════════ */
.vel-card{
  background:var(--surface);border-radius:var(--r-sm);
  border:1.5px solid var(--border);margin-bottom:10px;
  box-shadow:var(--shadow);overflow:hidden;
}
.vel-card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--navy);
}
.vel-card-hdr .vc-left{display:flex;align-items:center;gap:10px}
.vc-num{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);
  color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.vc-info{color:#fff}
.vc-info strong{display:block;font-size:14px;font-weight:700}
.vc-info span{font-size:11px;opacity:.75}
.vc-avg{text-align:right}
.vc-avg .avg-val{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.vc-avg .avg-lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px}
.vel-readings{padding:12px 14px}
.vr-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vr-lbl{font-size:12px;color:var(--text3);min-width:48px}
.vr-inp{flex:1}
.vr-del{color:var(--text3);font-size:14px;padding:2px 6px;flex-shrink:0}
.vr-del:hover{color:var(--danger)}
.vel-readings .btn-add-row{margin:4px 0 0}

/* ══════════════════════════════
   FLOAT METHOD
══════════════════════════════ */
.unit-tog{
  display:flex;background:var(--surface);border-radius:var(--r-sm);
  overflow:hidden;border:1.5px solid var(--border);
  box-shadow:var(--shadow);
}
.ut-btn{
  flex:1;padding:11px;font-size:15px;font-weight:700;
  color:var(--text3);transition:all .15s;text-align:center;
}
.ut-btn.active{background:var(--navy);color:#fff}
.unit-warn{
  background:#FFF8EE;border:1.5px solid #FFDDA0;
  border-radius:var(--r-sm);padding:10px 14px;
  font-size:13px;color:var(--warn);margin-bottom:16px;font-weight:500;
}

/* ══════════════════════════════
   RESULTS
══════════════════════════════ */
.result-site-card{
  background:var(--surface);border-radius:var(--r-sm);
  border:1.5px solid var(--border);padding:14px 16px;
  margin-bottom:16px;box-shadow:var(--shadow);
}
.rsc-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:3px}
.rsc-meta{font-size:12px;color:var(--text3);line-height:1.6}

.result-hero{
  background:var(--navy);border-radius:var(--r);
  padding:32px 20px;text-align:center;margin-bottom:14px;
  position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
}
.result-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent);
}
.result-hero::after{
  content:'';position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,120,190,.3),transparent);
}
.rh-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--navy-pale);opacity:.7;margin-bottom:10px}
.rh-val{font-size:58px;font-weight:900;color:#fff;letter-spacing:-3px;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.rh-unit{font-size:20px;font-weight:500;color:var(--navy-pale)}
.rh-method{font-size:12px;color:rgba(255,255,255,.45);margin-top:12px}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{
  background:var(--surface);border-radius:var(--r-sm);
  padding:12px 10px;text-align:center;
  border:1.5px solid var(--border);box-shadow:var(--shadow);
}
.kpi span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px}
.kpi strong{font-size:14px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

details.breakdown{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:14px;overflow:hidden;
  box-shadow:var(--shadow);
}
details summary{
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;
  color:var(--text2);user-select:none;list-style:none;
  display:flex;justify-content:space-between;align-items:center;
}
details summary::after{content:'›';transform:rotate(90deg);display:inline-block;transition:transform .2s}
details[open] summary::after{transform:rotate(270deg)}
details[open] summary{border-bottom:1px solid var(--border)}
.bd-table{width:100%;border-collapse:collapse;font-size:12px;display:block;overflow-x:auto}
.bd-table th{background:var(--bg);padding:9px 10px;text-align:right;font-weight:700;color:var(--text2);white-space:nowrap;font-size:11px;letter-spacing:.3px}
.bd-table th:first-child{text-align:center}
.bd-table td{padding:8px 10px;border-top:1px solid var(--border);text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.bd-table td:first-child{text-align:center;color:var(--text3);font-weight:700}
.bd-grid{padding:12px 16px}
.bd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.bd-row:last-child{border-bottom:none}
.bd-row span{color:var(--text2)}
.bd-row strong{font-weight:700;font-variant-numeric:tabular-nums}

.result-actions{display:flex;flex-direction:column;gap:8px}
.save-confirm{
  display:none;text-align:center;color:var(--success);
  font-size:14px;font-weight:700;padding:8px;
}

/* ══════════════════════════════
   HISTORY
══════════════════════════════ */
.hist-list{padding:8px 0}
.hist-card{
  background:var(--surface);border-radius:var(--r);
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;
}
.hc-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 0;
}
.hc-top strong{font-size:16px;font-weight:700;color:var(--navy)}
.hc-del{color:var(--text3);font-size:15px;padding:2px 6px;transition:color .15s}
.hc-del:hover{color:var(--danger)}
.hc-loc{font-size:12px;color:var(--text3);padding:3px 16px 10px}
.hc-bot{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:10px 16px 14px;border-top:1px solid var(--border);background:var(--bg);
}
.hc-q .qv{font-size:28px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.hc-q .qu{font-size:12px;color:var(--text3)}
.hc-meta span{display:block;font-size:11px;color:var(--text3);text-align:right}
.hc-meta .method-badge{
  display:inline-block;margin-top:5px;padding:4px 10px;
  border-radius:20px;font-size:11px;font-weight:700;
  background:var(--navy);color:#fff;
}
.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.es-icon{font-size:48px;opacity:.2;margin-bottom:16px;display:block}
.es-title{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--text)}
.es-sub{font-size:13px;color:var(--text3)}

/* ══════════════════════════════
   GUIDE
══════════════════════════════ */
.guide-tabs{
  display:flex;background:var(--surface);border-radius:var(--r);
  overflow:hidden;border:1.5px solid var(--border);
  box-shadow:var(--shadow);margin-bottom:20px;
}
.g-tab{
  flex:1;padding:13px 8px;font-size:14px;font-weight:700;
  color:var(--text3);text-align:center;transition:all .18s;
}
.g-tab.active{background:var(--navy);color:#fff}
.g-section-title{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--navy);margin-bottom:8px}
.g-intro{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:24px}
.g-step{display:flex;gap:16px;margin-bottom:22px}
.g-step-num{
  width:30px;height:30px;border-radius:50%;background:var(--navy);
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.g-step-body strong{display:block;font-size:15px;font-weight:700;margin-bottom:6px;color:var(--navy)}
.g-step-body p{font-size:13px;color:var(--text2);line-height:1.7}
.g-formula{
  background:var(--navy);color:#fff;border-radius:var(--r-sm);
  padding:14px 18px;font-size:15px;font-weight:700;
  text-align:center;letter-spacing:.5px;margin-top:10px;
  font-variant-numeric:tabular-nums;
}
.g-tip{
  background:linear-gradient(135deg,#EAF4FB,#EEF7FD);
  border:1.5px solid #9ED6F0;border-radius:var(--r-sm);
  padding:16px;margin-top:8px;
}
.g-tip strong{display:block;font-size:14px;font-weight:700;color:#0D5FA3;margin-bottom:10px}
.g-tip ul{padding-left:18px}
.g-tip li{font-size:13px;color:#1A5A88;line-height:1.7;margin-bottom:4px}
.cf-table{border-radius:var(--r-sm);overflow:hidden;border:1.5px solid var(--border);margin:10px 0}
.cf-row{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px}
.cf-row:last-child{border-bottom:none}
.cf-row span{color:var(--text2)}
.cf-row strong{color:var(--success);font-weight:700}
.g-placeholder{
  background:var(--surface2);border:2px dashed var(--border);
  border-radius:var(--r);padding:36px 20px;text-align:center;
  margin:16px 0;
}
.g-ph-icon{font-size:36px;margin-bottom:12px;opacity:.3;display:block}
.g-ph-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:6px}
.g-ph-sub{font-size:12px;color:var(--text3);line-height:1.6}

/* ══════════════════════════════
   COMBINED MEASURE PAGE
══════════════════════════════ */
.measure-section-hdr{
  display:flex;align-items:center;gap:12px;
  margin:20px 0 12px;
}
.ms-badge{
  width:30px;height:30px;border-radius:50%;
  background:var(--navy);color:#fff;
  font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ms-badge-dim{background:var(--border);color:var(--text3)}
.ms-title{font-size:15px;font-weight:700;color:var(--navy);line-height:1.2}
.ms-sub{font-size:12px;color:var(--text3);margin-top:2px}
.vel-locked{
  background:var(--surface2);border:1.5px dashed var(--border);
  border-radius:var(--r-sm);padding:24px 20px;text-align:center;
  color:var(--text3);font-size:13px;line-height:1.6;margin-bottom:8px;
}
.vel-locked p{margin-top:8px}
.sticky-calc{
  position:sticky;bottom:16px;z-index:10;
  margin-top:24px;
  filter:drop-shadow(0 4px 16px rgba(26,58,108,.2));
}
/* Interleaved xsec */
.xsec-boundary{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.xb-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  background:var(--border);border:2px solid var(--navy-light);
  margin-left:1px;
}
.xb-bank{background:var(--navy);border-color:var(--navy)}
.xb-body{flex:1}
.xsec-seg-row{display:flex;align-items:stretch;gap:0}
.xseg-line{width:7px;border-right:2px dashed var(--border);margin:0 6px 0 8px;flex-shrink:0}
.xseg-card{
  flex:1;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:10px 12px;margin:4px 0;
  box-shadow:var(--shadow);
}

const App = { page:'home', calc:null };
const uid = ()=>Math.random().toString(36).slice(2,9);

function freshCalc(){
  return {
    step:'details', // details | method | measure | results
    substep:'xsec', // xsec | vel  (for meter method)
    unit:'m',
    details:{ name:'', location:'', weather:'☀️ Clear', datetime:localNow(), notes:'' },
    method:null,
    // Meter — mean-section method
    // depths[i] = boundary depth between segment i-1 and i (n+1 values)
    // segments[i] = {id, width} (n values)
    depths:['',''],       // starts with 1 segment → 2 boundaries
    segments:[{id:uid(),width:''}],
    velocities:{},        // {segId: ['','','']}
    // Floater
    floater:{ reach:'', width:'', avgDepth:'', cf:'0.85', runs:['','',''] },
    result:null
  };
}

function localNow(){
  const d=new Date();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

/* ═══════════════════════════
   STORAGE
═══════════════════════════ */
const Store={
  save(rec){
    const h=this.load(); h.unshift({...rec,savedAt:new Date().toISOString()});
    if(h.length>200)h.length=200;
    try{localStorage.setItem('sc2',JSON.stringify(h));}catch(e){}
  },
  load(){ try{return JSON.parse(localStorage.getItem('sc2')||'[]');}catch{return [];} },
  del(i){ const h=this.load();h.splice(i,1);try{localStorage.setItem('sc2',JSON.stringify(h));}catch(e){} },
  clear(){ try{localStorage.removeItem('sc2');}catch(e){} }
};

const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(iso){
  if(!iso)return '';
  try{return new Date(iso).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  catch{return iso;}
}
function fmtShortDate(iso){
  if(!iso)return '';
  try{return new Date(iso).toLocaleDateString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
  catch{return iso;}
}

/* ═══════════════════════════
   CALCULATIONS
═══════════════════════════ */
function avgVel(readings){
  const vals=readings.map(parseFloat).filter(v=>v>0&&!isNaN(v));
  if(!vals.length)return NaN;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function calcMeanSection(segments, depths, velocities){
  // depths has n+1 values, segments has n values
  // A_i = width_i × (depth_i + depth_{i+1}) / 2
  // Q_i = A_i × mean_velocity_i
  if(segments.length<1||depths.length<2)return null;
  let totalQ=0,totalA=0;
  const strips=[];
  for(let i=0;i<segments.length;i++){
    const w=parseFloat(segments[i].width);
    const dL=parseFloat(depths[i]);
    const dR=parseFloat(depths[i+1]);
    const v=avgVel(velocities[segments[i].id]||[]);
    if(isNaN(w)||w<=0||isNaN(dL)||dL<0||isNaN(dR)||dR<0||isNaN(v)||v<0)return null;
    const avgD=(dL+dR)/2;
    const a=w*avgD;
    const q=a*v;
    totalA+=a; totalQ+=q;
    strips.push({i:i+1,w,dL,dR,avgD,v,a,q});
  }
  if(!strips.length)return null;
  return{Q:totalQ,A:totalA,V:totalA>0?totalQ/totalA:0,strips,n:segments.length};
}

function calcFloater(f){
  const reach=parseFloat(f.reach),width=parseFloat(f.width);
  const avgDepth=parseFloat(f.avgDepth),cf=parseFloat(f.cf);
  const runs=f.runs.map(parseFloat).filter(r=>r>0&&!isNaN(r));
  if(!reach||!width||!avgDepth||!cf||!runs.length)return null;
  const avgTime=runs.reduce((a,b)=>a+b,0)/runs.length;
  const Vs=reach/avgTime,Vm=Vs*cf,A=width*avgDepth,Q=Vm*A;
  return{Q,A,Vs,Vm,avgTime,validRuns:runs};
}

/* ═══════════════════════════
   SVG CROSS SECTION
═══════════════════════════ */
function buildSVG(segments, depths){
  // Build boundary points from cumulative widths + depths
  if(!segments||!depths||depths.length<2)
    return `<div class="svg-ph"><span class="ph-icon">〰️</span>Add at least 1 section with width and both boundary depths to see the preview.</div>`;

  // Parse and validate all values
  const parsedDepths=depths.map(parseFloat);
  const parsedWidths=segments.map(s=>parseFloat(s.width));
  const allDepsOk=parsedDepths.every(d=>!isNaN(d)&&d>=0);
  const allWidOk=parsedWidths.every(w=>!isNaN(w)&&w>0);
  const totalW=parsedWidths.reduce((a,b)=>a+(isNaN(b)?0:b),0);

  if(!allDepsOk||totalW<=0)
    return `<div class="svg-ph"><span class="ph-icon">〰️</span>Fill in all boundary depths and section widths to see the cross-section preview.</div>`;

  // Build x,d point array for each boundary
  const pts=[];
  let cumX=0;
  for(let i=0;i<=segments.length;i++){
    pts.push({x:cumX, d:parsedDepths[i]||0});
    if(i<segments.length) cumX+=parsedWidths[i]||0;
  }

  const W=400,H=160;
  const PL=34,PR=12,PT=18,PB=26;
  const PW=W-PL-PR, PH=H-PT-PB;
  const maxX=totalW||1;
  const maxD=Math.max(...parsedDepths.filter(d=>!isNaN(d)))||1;
  // Small horizontal padding so bank points don't land on axis edge
  const xPad=maxX*0.04;
  const xMin=0-xPad, xRange=maxX+xPad*2;
  const mx=x=>PL+((x-xMin)/xRange)*PW;
  const my=d=>PT+(d/maxD)*PH;

  const waterPoly=[`${PL},${PT}`,...pts.map(p=>`${mx(p.x).toFixed(1)},${my(p.d).toFixed(1)}`),`${PL+PW},${PT}`].join(' ');
  const profileLine=pts.map(p=>`${mx(p.x).toFixed(1)},${my(p.d).toFixed(1)}`).join(' ');

  // Section dividers (vertical lines at each internal boundary)
  const dividers=pts.slice(1,-1).map(p=>
    `<line x1="${mx(p.x).toFixed(1)}" y1="${PT}" x2="${mx(p.x).toFixed(1)}" y2="${my(p.d).toFixed(1)}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="3,2"/>`
  ).join('');

  // Section labels (number centred in each section)
  let segLabels='';
  let cx=0;
  for(let i=0;i<segments.length;i++){
    const w=parsedWidths[i]||0;
    const midX=cx+w/2;
    const midD=(parsedDepths[i]+parsedDepths[i+1])/2;
    segLabels+=`<text x="${mx(midX).toFixed(1)}" y="${(my(midD)-6).toFixed(1)}" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="-apple-system,sans-serif" opacity="0.9">${i+1}</text>`;
    cx+=w;
  }

  // Boundary dots
  const dots=pts.map(p=>`<circle cx="${mx(p.x).toFixed(1)}" cy="${my(p.d).toFixed(1)}" r="3.5" fill="#0D5FA3" stroke="white" stroke-width="1.5"/>`).join('');

  // Depth axis ticks
  let depthTicks='';
  for(let i=0;i<=3;i++){
    const d=maxD*i/3, y=my(d);
    depthTicks+=`<line x1="${PL-3}" y1="${y.toFixed(1)}" x2="${PL}" y2="${y.toFixed(1)}" stroke="#68A8CA" stroke-width="1"/>`;
    depthTicks+=`<text x="${PL-5}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#68A8CA" font-size="8.5" font-family="-apple-system,sans-serif">${d.toFixed(1)}</text>`;
  }

  // Width labels on top of each section
  let widthLabels='';
  cx=0;
  for(let i=0;i<segments.length;i++){
    const w=parsedWidths[i]||0;
    widthLabels+=`<text x="${mx(cx+w/2).toFixed(1)}" y="${PT-5}" text-anchor="middle" fill="#68A8CA" font-size="8" font-family="-apple-system,sans-serif">${w.toFixed(2)}</text>`;
    cx+=w;
  }

  return `<div style="background:#fff;border-radius:10px;border:1.5px solid #BEE0F2;overflow:hidden;box-shadow:0 2px 12px rgba(13,95,163,.08)">
  <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
    <defs>
      <linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6DC4EC" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#1A7FC7" stop-opacity="0.75"/>
      </linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="#F0F8FD"/>
    <polygon points="${waterPoly}" fill="url(#wg2)"/>
    <line x1="${PL}" y1="${PT}" x2="${mx(pts[0].x).toFixed(1)}" y2="${my(pts[0].d).toFixed(1)}" stroke="#68A8CA" stroke-width="2" stroke-linecap="round"/>
    <polyline points="${profileLine}" fill="none" stroke="#0D5FA3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${mx(pts[pts.length-1].x).toFixed(1)}" y1="${my(pts[pts.length-1].d).toFixed(1)}" x2="${PL+PW}" y2="${PT}" stroke="#68A8CA" stroke-width="2" stroke-linecap="round"/>
    <line x1="${PL}" y1="${PT}" x2="${PL+PW}" y2="${PT}" stroke="#6DC4EC" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>
    ${dividers}${segLabels}${dots}
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+PH}" stroke="#BEE0F2" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+PH}" x2="${PL+PW}" y2="${PT+PH}" stroke="#BEE0F2" stroke-width="1"/>
    ${depthTicks}${widthLabels}
    <text x="${PL+6}" y="${PT-4}" fill="#6DC4EC" font-size="8.5" font-family="-apple-system,sans-serif" font-weight="600">Water Surface</text>
  </svg>
</div>`;
}

/* ═══════════════════════════
   RENDER — CALC SHELL
═══════════════════════════ */
function renderCalc(){
  const steps=['details','method','measure','results'];
  const ci=steps.indexOf(App.calc.step);
  return `<div class="page">
  <div class="topbar">
    <button class="btn-back" data-a="back">
      <svg width="8" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      &nbsp;Back
    </button>
    <div class="step-pips">
      ${steps.map((_,i)=>`<div class="pip${ci===i?' active':ci>i?' done':''}"></div>`).join('')}
    </div>
    <div style="min-width:64px"></div>
  </div>
  ${renderCalcStep()}
</div>`;
}

function renderCalcStep(){
  const s=App.calc.step;
  if(s==='details') return renderDetails();
  if(s==='method')  return renderMethod();
  if(s==='measure') return App.calc.method==='meter'?renderMeter():renderFloater();
  if(s==='results') return renderResults();
  return '';
}

/* ═══════════════════════════
   DETAILS
═══════════════════════════ */
function renderDetails(){
  const d=App.calc.details;
  const weathers=['☀️ Clear','⛅ Partly Cloudy','☁️ Overcast','🌦️ Light Rain','🌧️ Heavy Rain','🌫️ Foggy'];
  return `<div class="cwrap">
  <h2>Site Details</h2>
  <p class="sub">Project info and conditions before you measure.</p>
  <div class="fg">
    <label>Project / Activity Name</label>
    <input type="text" id="f-name" class="inp" value="${esc(d.name)}" placeholder="e.g. Libi River Survey 2025">
  </div>
  <div class="fg">
    <label>Location / Address</label>
    <input type="text" id="f-loc" class="inp" value="${esc(d.location)}" placeholder="e.g. Brgy. Libi, Bukidnon">
  </div>
  <div class="fg">
    <label>Date &amp; Time</label>
    <input type="datetime-local" id="f-dt" class="inp" value="${esc(d.datetime)}">
  </div>
  <div class="fg">
    <label>Weather</label>
    <div class="weather-row">
      ${weathers.map(w=>`<button class="w-pill${d.weather===w?' active':''}" data-w="${esc(w)}">${w}</button>`).join('')}
    </div>
  </div>
  <div class="fg">
    <label>Notes <span class="opt">(optional)</span></label>
    <textarea id="f-notes" class="inp" rows="3" placeholder="Field observations, equipment used…">${esc(d.notes)}</textarea>
  </div>
  <button class="btn-primary" data-a="details-next">Continue →</button>
</div>`;
}

/* ═══════════════════════════
   METHOD
═══════════════════════════ */
function renderMethod(){
  const m=App.calc.method;
  return `<div class="cwrap">
  <h2>Method</h2>
  <p class="sub">How will you be measuring velocity today?</p>
  <button class="method-card${m==='meter'?' active':''}" data-a="sel-meter">
    <div class="mi-icon">〰</div>
    <div class="mi-body">
      <strong>Current Meter</strong>
      <p>Measure velocity at each vertical using a flow meter. Standard mid-section method. Recommended for formal surveys.</p>
    </div>
  </button>
  <button class="method-card${m==='floater'?' active':''}" data-a="sel-floater">
    <div class="mi-icon">◌</div>
    <div class="mi-body">
      <strong>Float Method</strong>
      <p>Time a float across a measured reach. No equipment needed — great for quick field estimates.</p>
    </div>
  </button>
  <button class="btn-primary${m?'':' off'}" data-a="method-next" ${m?'':'disabled'}>Continue →</button>
  <button class="btn-secondary" data-a="back-step">‹ Back to Details</button>
</div>`;
}

/* ═══════════════════════════
   FLOW METER — COMBINED PAGE
═══════════════════════════ */
function renderMeter(){
  const c=App.calc;
  const u=c.unit==='m'?'m':'ft';
  const n=c.segments.length;
  // Check all depths and widths filled
  const depsOk=c.depths.every(d=>d!=='');
  const widOk=c.segments.every(s=>s.width!=='');
  const xsecOk=depsOk&&widOk&&n>=1;
  const allReady=xsecOk&&c.segments.every(s=>{
    const vels=(c.velocities[s.id]||[]).map(parseFloat).filter(v=>v>0&&!isNaN(v));
    return vels.length>=3;
  });

  return `<div class="cwrap" style="padding-bottom:100px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <h2 style="margin-bottom:0">Measurement</h2>
    <div class="unit-tog" style="width:100px">
      <button class="ut-btn${c.unit==='m'?' active':''}" data-a="unit-m">m</button>
      <button class="ut-btn${c.unit==='ft'?' active':''}" data-a="unit-ft">ft</button>
    </div>
  </div>
  <p class="sub">Fill cross-section top to bottom, then enter velocity readings per section.</p>
  <div class="unit-warn">⚠ Keep <strong>${c.unit==='m'?'metres':'feet'}</strong> consistent throughout this session.</div>

  <!-- ── SECTION A: CROSS-SECTION ── -->
  <div class="measure-section-hdr">
    <div class="ms-badge">A</div>
    <div>
      <div class="ms-title">Cross-Section</div>
      <div class="ms-sub">${n} section${n!==1?'s':''} · ${n+1} boundary depths · Mean-section method</div>
    </div>
  </div>

  <div class="svg-container" id="svg-wrap">${buildSVG(c.segments,c.depths)}</div>

  <!-- Interleaved boundary depths + section widths -->
  <div id="xsec-list">
    ${renderXsecList(c,u)}
  </div>

  <button class="btn-add-row" data-a="add-seg">+ Add Section</button>

  <!-- ── SECTION B: VELOCITY ── -->
  <div class="measure-section-hdr" style="margin-top:8px">
    <div class="ms-badge${xsecOk?'':' ms-badge-dim'}">B</div>
    <div>
      <div class="ms-title" style="${xsecOk?'':'color:var(--text3)'}">Velocity Readings</div>
      <div class="ms-sub">${xsecOk?'Meter at 0.6 × avg section depth · min. 3 readings per section':'Complete cross-section above to unlock'}</div>
    </div>
  </div>

  ${xsecOk?`<div id="vel-list">
    ${c.segments.map((s,i)=>renderVelCard(s,i,u,c)).join('')}
  </div>`:`<div class="vel-locked">
    <span style="font-size:22px;opacity:.3">〰</span>
    <p>Fill in all widths and boundary depths above to unlock velocity entry.</p>
  </div>`}

  <!-- ── STICKY FOOTER ── -->
  <div class="sticky-calc">
    <button class="btn-primary${allReady?'':' off'}" data-a="calc-meter" ${allReady?'':'disabled'}>
      ${allReady?'Calculate Flow ✓':'Complete cross-section &amp; velocity readings'}
    </button>
  </div>
  <button class="btn-secondary" style="margin-top:8px" data-a="back-step">‹ Back to Method</button>
</div>`;
}

function renderXsecList(c,u){
  // Renders interleaved: [boundary 0] [section 1] [boundary 1] [section 2] ... [boundary n]
  let html='';
  for(let i=0;i<=c.segments.length;i++){
    const isLeft=i===0, isRight=i===c.segments.length;
    const label=isLeft?'Left Bank':isRight?'Right Bank':`Boundary ${i+1}`;
    // Depth boundary card
    html+=`<div class="xsec-boundary${isLeft?' xsec-bank-left':isRight?' xsec-bank-right':''}">
      <div class="xb-dot${isLeft||isRight?' xb-bank':''}"></div>
      <div class="xb-body">
        <div class="si-lbl">${label} — Depth (${u})</div>
        <input type="number" class="s-inp depth-inp" data-di="${i}" value="${esc(c.depths[i])}" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>`;
    // Section card (not after the last boundary)
    if(i<c.segments.length){
      const s=c.segments[i];
      html+=`<div class="xsec-seg-row">
        <div class="xseg-line"></div>
        <div class="xseg-card">
          <div class="sec-num" style="flex-shrink:0">${i+1}</div>
          <div style="flex:1">
            <div class="si-lbl">Section ${i+1} — Width (${u})</div>
            <input type="number" class="s-inp width-inp" data-si="${i}" value="${esc(s.width)}" placeholder="0.00" step="0.01" min="0">
          </div>
          ${c.segments.length>1?`<button class="sec-del" data-a="del-seg" data-si="${i}">✕</button>`:''}
        </div>
        <div class="xseg-line"></div>
      </div>`;
    }
  }
  return html;
}

function renderVelCard(s,i,u,c){
  const dL=parseFloat(c.depths[i])||0;
  const dR=parseFloat(c.depths[i+1])||0;
  const avgD=(dL+dR)/2;
  const meterDepth=(avgD*0.6).toFixed(2);
  const vels=c.velocities[s.id]||(c.velocities[s.id]=['','','']);
  const avg=avgVel(vels);
  const validCount=vels.map(parseFloat).filter(v=>v>0&&!isNaN(v)).length;

  return `<div class="vel-card">
  <div class="vel-card-hdr">
    <div class="vc-left">
      <div class="vc-num">${i+1}</div>
      <div class="vc-info">
        <strong>Section ${i+1}</strong>
        <span>Width: ${parseFloat(s.width).toFixed(2)} ${u} · Avg depth: ${avgD.toFixed(2)} ${u} · Meter at: ${meterDepth} ${u}</span>
      </div>
    </div>
    <div class="vc-avg">
      <div class="avg-val">${isNaN(avg)?'—':avg.toFixed(3)}</div>
      <div class="avg-lbl">${u}/s avg</div>
    </div>
  </div>
  <div class="vel-readings">
    ${vels.map((v,ri)=>`
    <div class="vr-row">
      <span class="vr-lbl">Reading ${ri+1}</span>
      <input type="number" class="inp vr-inp" data-sid="${s.id}" data-ri="${ri}" value="${esc(v)}" placeholder="0.000 ${u}/s" step="0.001" min="0" style="padding:10px 12px;font-size:14px">
      ${vels.length>3?`<button class="vr-del" data-a="del-vel" data-sid="${s.id}" data-ri="${ri}">✕</button>`:''}
    </div>`).join('')}
    <button class="btn-add-row" data-a="add-vel" data-sid="${s.id}">+ Add Reading</button>
    <div class="vr-status" style="font-size:11px;color:${validCount>=3?'var(--success)':'var(--warn)'};font-weight:600;margin-top:2px">
      ${validCount>=3?`✓ ${validCount} valid readings`:`${validCount}/3 minimum readings`}
    </div>
  </div>
</div>`;
}

      <strong>Measure Velocity (0.6d Rule)</strong>

function updateVelSection(){
  const c=App.calc;
  const u=c.unit==='m'?'m':'ft';
  const depsOk=c.depths.every(d=>d!=='');
  const widOk=c.segments.every(s=>s.width!=='');
  const xsecOk=depsOk&&widOk&&c.segments.length>=1;

  // Update badge + subtitle
  const badge=document.querySelector('.measure-section-hdr:nth-of-type(2) .ms-badge');
  const title=document.querySelector('.measure-section-hdr:nth-of-type(2) .ms-title');
  const sub=document.querySelector('.measure-section-hdr:nth-of-type(2) .ms-sub');
  if(badge) badge.classList.toggle('ms-badge-dim',!xsecOk);
  if(title) title.style.color=xsecOk?'':'var(--text3)';
  if(sub)   sub.textContent=xsecOk
    ?'Meter at 0.6 × avg section depth · min. 3 readings per section'
    :'Complete cross-section above to unlock';

  // Swap locked placeholder ↔ velocity cards
  const container=document.getElementById('vel-list')||document.querySelector('.vel-locked');
  if(!container)return;
  if(xsecOk){
    // Ensure velocity arrays exist
    c.segments.forEach(s=>{ if(!c.velocities[s.id]) c.velocities[s.id]=['','','']; });
    const div=document.createElement('div');
    div.id='vel-list';
    div.innerHTML=c.segments.map((s,i)=>renderVelCard(s,i,u,c)).join('');
    container.replaceWith(div);
  } else {
    if(!container.classList.contains('vel-locked')){
      const div=document.createElement('div');
      div.className='vel-locked';
      div.innerHTML='<span style="font-size:22px;opacity:.3">〰</span><p>Fill in all widths and boundary depths above to unlock velocity entry.</p>';
      container.replaceWith(div);
    }
  }
  updateCalcBtn();
}

function updateCalcBtn(){
  const btn=document.querySelector('.sticky-calc .btn-primary');
  if(!btn)return;
  const c=App.calc;
  const depsOk=c.depths.every(d=>d!=='');
  const widOk=c.segments.every(s=>s.width!=='');
  const allReady=depsOk&&widOk&&c.segments.length>=1&&c.segments.every(s=>{
    const vels=(c.velocities[s.id]||[]).map(parseFloat).filter(v=>v>0&&!isNaN(v));
    return vels.length>=3;
  });
  btn.disabled=!allReady;
  btn.classList.toggle('off',!allReady);
  btn.textContent=allReady?'Calculate Flow ✓':'Complete cross-section & velocity readings';
}

  const wb=e.target.closest('[data-w]');
  if(wb){
    App.calc.details.weather=wb.dataset.w;
    document.querySelectorAll('.w-pill').forEach(b=>b.classList.toggle('active',b.dataset.w===wb.dataset.w));
    return;
  }
  const tab=e.target.closest('[data-tab]');
  if(tab){
    const which=tab.dataset.tab;
    $('guide-body').innerHTML=which==='meter'?guideMeter():guideFloater();
    document.querySelectorAll('.g-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));
    return;
  }
});

document.addEventListener('input',e=>{
  // Depth boundary inputs
  if(e.target.classList.contains('depth-inp')){
    const di=parseInt(e.target.dataset.di);
    App.calc.depths[di]=e.target.value;
    const wrap=$('svg-wrap');
    if(wrap)wrap.innerHTML=buildSVG(App.calc.segments,App.calc.depths);
    updateVelSection();
    return;
  }
  // Section width inputs
  if(e.target.classList.contains('width-inp')){
    const si=parseInt(e.target.dataset.si);
    App.calc.segments[si].width=e.target.value;
    const wrap=$('svg-wrap');
    if(wrap)wrap.innerHTML=buildSVG(App.calc.segments,App.calc.depths);
    updateVelSection();
    return;
  }
  // Velocity reading inputs
  if(e.target.classList.contains('vr-inp')&&e.target.dataset.sid){
    const sid=e.target.dataset.sid, ri=parseInt(e.target.dataset.ri);
    if(!App.calc.velocities[sid])App.calc.velocities[sid]=[];
    App.calc.velocities[sid][ri]=e.target.value;
    // Update avg display inline
    const avg=avgVel(App.calc.velocities[sid]);
    const card=e.target.closest('.vel-card');
    if(card){
      const avgEl=card.querySelector('.avg-val');
      if(avgEl)avgEl.textContent=isNaN(avg)?'—':avg.toFixed(3);
      // Update per-card status text
      const validCount=App.calc.velocities[sid].map(parseFloat).filter(v=>v>0&&!isNaN(v)).length;
      const statusEl=card.querySelector('.vr-status');
      if(statusEl){
        statusEl.style.color=validCount>=3?'var(--success)':'var(--warn)';
        statusEl.textContent=validCount>=3?`✓ ${validCount} valid readings`:`${validCount}/3 minimum readings`;
      }
    }
    // Update sticky Calculate button live
    updateCalcBtn();
    return;
  }
  // Run inputs (floater)
  if(e.target.classList.contains('run-inp')){
    const ri=parseInt(e.target.dataset.ri);
    App.calc.floater.runs[ri]=e.target.value;
    return;
  }
  // Details
  if(e.target.id==='f-name') App.calc.details.name=e.target.value;
  if(e.target.id==='f-loc')  App.calc.details.location=e.target.value;
  if(e.target.id==='f-dt')   App.calc.details.datetime=e.target.value;
  if(e.target.id==='f-notes')App.calc.details.notes=e.target.value;
  // Floater
  if(e.target.id==='fl-w') App.calc.floater.width=e.target.value;
  if(e.target.id==='fl-d') App.calc.floater.avgDepth=e.target.value;
  if(e.target.id==='fl-r') App.calc.floater.reach=e.target.value;
  if(e.target.id==='fl-cf')App.calc.floater.cf=e.target.value;
});

function saveDetailsFromForm(){
  App.calc.details.name=    ($('f-name')?.value||'').trim();
  App.calc.details.location=($('f-loc')?.value||'').trim();
  App.calc.details.datetime= $('f-dt')?.value||'';
  App.calc.details.notes=   ($('f-notes')?.value||'').trim();
}
function saveFloaterFromForm(){
  App.calc.floater.reach=   $('fl-r')?.value||'';
  App.calc.floater.width=   $('fl-w')?.value||'';
  App.calc.floater.avgDepth=$('fl-d')?.value||'';
  App.calc.floater.cf=      $('fl-cf')?.value||'0.85';
}

function downloadResultImage(){
  const c=App.calc, r=c.result, d=c.details;
  if(!r) return;
  const u=c.unit, uS=u==='m'?'m':'ft', qU=u==='m'?'m³/s':'ft³/s';

  const W=800, pad=40;
  // Estimate height
  const headerH=180, xsecH=c.method==='meter'?220:0, tableH=c.method==='meter'?(r.strips.length*34+60):220, footerH=60;
  const H=headerH+xsecH+tableH+footerH+pad*2;

  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  // Background
  ctx.fillStyle='#F0F8FD'; ctx.fillRect(0,0,W,H);

  // Header bar
  ctx.fillStyle='#0D5FA3'; ctx.fillRect(0,0,W,100);
  ctx.fillStyle='#fff';
  ctx.font='bold 28px -apple-system,sans-serif';
  ctx.fillText('AgosCalculator',pad,38);
  ctx.font='14px -apple-system,sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('River Flow Calculator · Yamog',pad,62);
  ctx.font='13px -apple-system,sans-serif';
  ctx.fillText(d.name||'Unnamed Site',pad,84);

  let y=120;

  // Site meta
  ctx.fillStyle='#09375E'; ctx.font='bold 13px -apple-system,sans-serif';
  ctx.fillText((d.location||'')+'  '+d.weather+'  '+(d.datetime?new Date(d.datetime).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''),pad,y);
  y+=30;

  // Big Q value
  ctx.fillStyle='#0D5FA3'; ctx.font='bold 52px -apple-system,sans-serif';
  ctx.fillText(r.Q.toFixed(4),pad,y+50);
  ctx.fillStyle='#2B6A94'; ctx.font='20px -apple-system,sans-serif';
  ctx.fillText(qU,pad+ctx.measureText(r.Q.toFixed(4)).width+10,y+50);
  ctx.fillStyle='#68A8CA'; ctx.font='12px -apple-system,sans-serif';
  ctx.fillText('Discharge Q',pad,y+10);
  y+=80;

  // KPIs
  const kpis=[
    ['Cross-Section Area', r.A.toFixed(3)+' '+uS+'²'],
    ['Mean Velocity', (c.method==='meter'?r.V:r.Vm).toFixed(3)+' '+uS+'/s'],
    [c.method==='meter'?'Sections':'Float Runs', c.method==='meter'?r.n:r.validRuns.length],
    ['Method', c.method==='meter'?'Current Meter':'Float Method'],
  ];
  const kW=(W-pad*2)/kpis.length;
  kpis.forEach((k,i)=>{
    const kx=pad+i*kW;
    ctx.fillStyle='#fff';
    roundRect(ctx,kx,y,kW-10,56,8);
    ctx.fill();
    ctx.fillStyle='#68A8CA'; ctx.font='bold 10px -apple-system,sans-serif';
    ctx.fillText(k[0].toUpperCase(),kx+10,y+18);
    ctx.fillStyle='#09375E'; ctx.font='bold 16px -apple-system,sans-serif';
    ctx.fillText(String(k[1]),kx+10,y+42);
  });
  y+=72;

  // Cross-section diagram (meter method only)
  if(c.method==='meter' && c.segments && c.segments.length>0){
    const parsedDepths=c.depths.map(parseFloat);
    const parsedWidths=c.segments.map(s=>parseFloat(s.width));
    const allOk=parsedDepths.every(d=>!isNaN(d)&&d>=0)&&parsedWidths.every(w=>!isNaN(w)&&w>0);
    if(allOk){
      ctx.fillStyle='#fff'; roundRect(ctx,pad,y,W-pad*2,200,10); ctx.fill();
      ctx.strokeStyle='#BEE0F2'; ctx.lineWidth=1.5; ctx.stroke();

      // title
      ctx.fillStyle='#0D5FA3'; ctx.font='bold 12px -apple-system,sans-serif';
      ctx.fillText('CROSS-SECTION PROFILE',pad+14,y+20);

      const PL=60,PR=20,PT=y+34,PH=140,PB=20;
      const PW=W-pad*2-PL-PR;
      const totalW=parsedWidths.reduce((a,b)=>a+b,0)||1;
      const maxD=Math.max(...parsedDepths.filter(d=>!isNaN(d)))||1;
      const xPad=totalW*0.04;
      const xRange=totalW+xPad*2;
      const mx=x=>pad+PL+((x+xPad)/xRange)*PW;
      const my=d=>PT+(d/maxD)*PH;

      // Build points
      const pts=[];
      let cumX=0;
      for(let i=0;i<=c.segments.length;i++){
        pts.push({x:cumX,d:parsedDepths[i]||0});
        if(i<c.segments.length) cumX+=parsedWidths[i]||0;
      }

      // Water fill
      ctx.beginPath();
      ctx.moveTo(mx(pts[0].x),PT);
      pts.forEach(p=>ctx.lineTo(mx(p.x),my(p.d)));
      ctx.lineTo(mx(pts[pts.length-1].x),PT);
      ctx.closePath();
      const grad=ctx.createLinearGradient(0,PT,0,PT+PH);
      grad.addColorStop(0,'rgba(109,196,236,0.4)');
      grad.addColorStop(1,'rgba(26,127,199,0.75)');
      ctx.fillStyle=grad; ctx.fill();

      // Profile line
      ctx.beginPath();
      pts.forEach((p,i)=>i===0?ctx.moveTo(mx(p.x),my(p.d)):ctx.lineTo(mx(p.x),my(p.d)));
      ctx.strokeStyle='#0D5FA3'; ctx.lineWidth=2.5; ctx.stroke();

      // Water surface line
      ctx.beginPath(); ctx.moveTo(mx(pts[0].x),PT); ctx.lineTo(mx(pts[pts.length-1].x),PT);
      ctx.strokeStyle='#6DC4EC'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);

      // Section dividers + labels
      let cx2=0;
      c.segments.forEach((seg,i)=>{
        const w=parsedWidths[i]||0;
        if(i>0){
          ctx.beginPath(); ctx.moveTo(mx(cx2),PT); ctx.lineTo(mx(cx2),my(parsedDepths[i]));
          ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
        }
        // Section label
        const midX=cx2+w/2, midD=(parsedDepths[i]+parsedDepths[i+1])/2;
        ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='bold 9px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText(String(i+1),mx(midX),my(midD)-4);
        // Width label on top
        ctx.fillStyle='#68A8CA'; ctx.font='9px -apple-system,sans-serif';
        ctx.fillText(w.toFixed(2),mx(midX),PT-4);
        cx2+=w;
      });
      ctx.textAlign='left';

      // Boundary dots
      pts.forEach(p=>{
        ctx.beginPath(); ctx.arc(mx(p.x),my(p.d),4,0,Math.PI*2);
        ctx.fillStyle='#0D5FA3'; ctx.fill();
        ctx.strokeStyle='white'; ctx.lineWidth=1.5; ctx.stroke();
        // depth label
        ctx.fillStyle='#68A8CA'; ctx.font='9px -apple-system,sans-serif';
        ctx.fillText(p.d.toFixed(2),mx(p.x)+5,my(p.d)+3);
      });

      // Axes
      ctx.strokeStyle='#BEE0F2'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pad+PL,PT); ctx.lineTo(pad+PL,PT+PH+PB); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad+PL,PT+PH+PB); ctx.lineTo(pad+PL+PW,PT+PH+PB); ctx.stroke();

      // Water surface label
      ctx.fillStyle='#6DC4EC'; ctx.font='9px -apple-system,sans-serif';
      ctx.fillText('Water Surface',pad+PL+6,PT-6);

      y+=220;
    }
  }

  // Breakdown table
  ctx.fillStyle='#fff'; roundRect(ctx,pad,y,W-pad*2,tableH,10); ctx.fill();
  ctx.strokeStyle='#BEE0F2'; ctx.lineWidth=1.5; ctx.stroke();
  y+=20;
  ctx.fillStyle='#0D5FA3'; ctx.font='bold 12px -apple-system,sans-serif';
  if(c.method==='meter'){
    ctx.fillText('SECTION BREAKDOWN',pad+14,y);
    y+=22;
    const cols=['#','Width','Depth L','Depth R','Avg D','Velocity','Area','Q'];
    const cw=(W-pad*2-28)/cols.length;
    ctx.fillStyle='#EAF4FB'; ctx.fillRect(pad+14,y-14,W-pad*2-28,24);
    cols.forEach((col,i)=>{
      ctx.fillStyle='#2B6A94'; ctx.font='bold 10px -apple-system,sans-serif';
      ctx.textAlign=i===0?'center':'right';
      ctx.fillText(col,pad+14+i*cw+(i===0?cw/2:cw),y+2);
    });
    ctx.textAlign='left';
    y+=26;
    r.strips.forEach((s,ri)=>{
      if(ri%2===0){ctx.fillStyle='rgba(0,0,0,0.02)'; ctx.fillRect(pad+14,y-14,W-pad*2-28,24);}
      const vals=[s.i,s.w.toFixed(2),s.dL.toFixed(2),s.dR.toFixed(2),s.avgD.toFixed(2),s.v.toFixed(3),s.a.toFixed(3),s.q.toFixed(4)];
      vals.forEach((v,i)=>{
        ctx.fillStyle='#09375E'; ctx.font='12px -apple-system,sans-serif';
        ctx.textAlign=i===0?'center':'right';
        ctx.fillText(String(v),pad+14+i*cw+(i===0?cw/2:cw),y+2);
      });
      ctx.textAlign='left';
      y+=24;
    });
    // Total row
    ctx.fillStyle='rgba(13,95,163,0.08)'; ctx.fillRect(pad+14,y-14,W-pad*2-28,26);
    ctx.fillStyle='#0D5FA3'; ctx.font='bold 12px -apple-system,sans-serif';
    ctx.textAlign='right';
    ctx.fillText('TOTAL',pad+14+4*cw,y+3);
    ctx.fillText(r.A.toFixed(3),pad+14+6*cw,y+3);
    ctx.fillText(r.Q.toFixed(4),pad+14+7*cw,y+3);
    ctx.textAlign='left';
    y+=30;
  } else {
    ctx.fillText('MEASUREMENT DETAILS',pad+14,y);
    y+=22;
    const rows=[
      ['Reach Length', parseFloat(c.floater.reach).toFixed(2)+' '+uS],
      ['Channel Width', parseFloat(c.floater.width).toFixed(2)+' '+uS],
      ['Average Depth', parseFloat(c.floater.avgDepth).toFixed(2)+' '+uS],
      ['Float Runs', r.validRuns.map(t=>t.toFixed(1)+'s').join(', ')],
      ['Average Time', r.avgTime.toFixed(2)+' s'],
      ['Surface Velocity', r.Vs.toFixed(3)+' '+uS+'/s'],
      ['Correction Factor α', parseFloat(c.floater.cf).toFixed(2)],
      ['Mean Velocity', r.Vm.toFixed(3)+' '+uS+'/s'],
    ];
    rows.forEach((row,ri)=>{
      if(ri%2===0){ctx.fillStyle='rgba(0,0,0,0.02)'; ctx.fillRect(pad+14,y-14,W-pad*2-28,26);}
      ctx.fillStyle='#2B6A94'; ctx.font='13px -apple-system,sans-serif';
      ctx.fillText(row[0],pad+24,y+2);
      ctx.fillStyle='#09375E'; ctx.font='bold 13px -apple-system,sans-serif';
      ctx.textAlign='right'; ctx.fillText(row[1],W-pad-14,y+2); ctx.textAlign='left';
      y+=26;
    });
    y+=10;
  }

  // Footer
  y+=20;
  ctx.fillStyle='#0D5FA3';
  ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='11px -apple-system,sans-serif';
  ctx.fillText('Generated by AgosCalculator · App by Yamog · '+new Date().toLocaleDateString('en-PH'),pad,H-18);

  // Download
  cv.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const siteName=(d.name||'result').replace(/[^a-z0-9]/gi,'_').toLowerCase();
    a.download='agos_'+siteName+'_'+new Date().toISOString().slice(0,10)+'.png';
    a.click();
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function renderKeepScroll(){
  const sy=window.scrollY;
  render();
  requestAnimationFrame(()=>window.scrollTo(0,sy));
}
function handleAction(action,el){
  switch(action){
    case 'goto-calc':
      App.page='calc'; App.calc=freshCalc(); render(); break;
    case 'goto-history':
      App.page='history'; render(); break;
    case 'goto-guide':
      App.page='guide'; render(); break;
    case 'goto-home':
      App.page='home'; render(); break;

    case 'back':
      if(App.page==='calc'){
        const steps=['details','method','measure','results'];
        const ci=steps.indexOf(App.calc.step);
        if(ci<=0){ App.page='home'; render(); }
        else { App.calc.step=steps[ci-1]; render(); }
      } else { App.page='home'; render(); }
      break;

    case 'back-step':
      if(App.calc.step==='method')     { App.calc.step='details'; render(); }
      else if(App.calc.step==='measure'){ App.calc.step='method';  render(); }
      break;

    case 'back-to-xsec':
      App.calc.substep='xsec'; render(); break;

    case 'details-next':
      saveDetailsFromForm(); App.calc.step='method'; render(); break;

    case 'sel-meter':
      App.calc.method='meter';
      if(App.calc.segments.length===0){
        const id=uid();
        App.calc.segments=[{id,width:''}];
        App.calc.depths=['',''];
        App.calc.velocities={};
      }
      render(); break;

    case 'sel-floater':
      App.calc.method='floater'; render(); break;

    case 'method-next':
      if(App.calc.method){ App.calc.step='measure'; render(); }
      break;

    case 'unit-m': App.calc.unit='m'; render(); break;
    case 'unit-ft': App.calc.unit='ft'; render(); break;

    case 'add-seg':{
      const id=uid();
      App.calc.segments.push({id,width:''});
      App.calc.depths.push(''); // add one new right boundary
      render();
      setTimeout(()=>{
        const rows=document.querySelectorAll('.xseg-card');
        if(rows.length)rows[rows.length-1].scrollIntoView({behavior:'smooth',block:'center'});
      },80);
      break;
    }

    case 'del-seg':{
      const si=parseInt(el.dataset.si);
      if(App.calc.segments.length<=1)break; // keep at least 1
      const removedId=App.calc.segments[si].id;
      App.calc.segments.splice(si,1);
      App.calc.depths.splice(si+1,1); // remove the right boundary of deleted section
      delete App.calc.velocities[removedId];
      renderKeepScroll(); break;
    }

    case 'add-vel':{
      const sid=el.dataset.sid;
      if(!App.calc.velocities[sid])App.calc.velocities[sid]=['','',''];
      App.calc.velocities[sid].push('');
      renderKeepScroll(); break;
    }

    case 'del-vel':{
      const sid=el.dataset.sid, ri=parseInt(el.dataset.ri);
      if(App.calc.velocities[sid]&&App.calc.velocities[sid].length>3){
        App.calc.velocities[sid].splice(ri,1); renderKeepScroll();
      } break;
    }

    case 'add-run':
      App.calc.floater.runs.push(''); renderKeepScroll(); break;

    case 'del-run':{
      const ri=parseInt(el.dataset.ri);
      if(App.calc.floater.runs.length>3){App.calc.floater.runs.splice(ri,1);renderKeepScroll();}
      break;
    }

    case 'calc-meter':{
      const result=calcMeanSection(App.calc.segments,App.calc.depths,App.calc.velocities);
      if(!result){alert('Please complete all section widths, boundary depths, and add ≥3 velocity readings per section.');return;}
      App.calc.result=result; App.calc.step='results'; render(); break;
    }

    case 'calc-floater':{
      saveFloaterFromForm();
      const result=calcFloater(App.calc.floater);
      if(!result){alert('Please fill in reach length, channel width, average depth, and at least one float time.');return;}
      App.calc.result=result; App.calc.step='results'; render(); break;
    }

    case 'save-result':{
      Store.save({
        details:{...App.calc.details},
        method:App.calc.method, unit:App.calc.unit,
        result:App.calc.result,
        sections:App.calc.method==='meter'?App.calc.segments.map((s,i)=>({...s,dL:App.calc.depths[i],dR:App.calc.depths[i+1],velocities:[...(App.calc.velocities[s.id]||[])]})):null,
        floater:App.calc.method==='floater'?{...App.calc.floater}:null
      });
      const fb=$('save-fb');
      if(fb){fb.style.display='block';setTimeout(()=>{if($('save-fb'))$('save-fb').style.display='none';},2500);}
      break;
    }

    case 'download-result':
      downloadResultImage(); break;

    case 'retry':
      App.calc.result=null;
      if(App.calc.method==='meter'){
        Object.keys(App.calc.velocities).forEach(k=>App.calc.velocities[k]=['','','']);
      } else {
        App.calc.floater.runs=['','',''];
      }
      App.calc.step='measure'; render(); break;

    case 'new-meas':
      App.calc=freshCalc(); App.calc.step='details'; render(); break;

    case 'del-rec':{
      const idx=parseInt(el.dataset.idx);
      if(confirm('Delete this record?')){Store.del(idx);render();}
      break;
    }

    case 'clear-hist':
      if(confirm('Clear all history? This cannot be undone.')){Store.clear();render();}
      break;
  }
}
