<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D5FA3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgosCalculator">
<title>AgosCalculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ── RESET & ROOT ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EAF4FB;
  --surface:#FFFFFF;
  --surface2:#F0F8FD;
  --navy:#0D5FA3;
  --navy2:#1A7FC7;
  --navy3:#2B9FE0;
  --navy-light:#6DC4EC;
  --navy-pale:#BDE4F7;
  --text:#09375E;
  --text2:#2B6A94;
  --text3:#68A8CA;
  --border:#BEE0F2;
  --success:#0B9E72;
  --danger:#D93050;
  --warn:#E07820;
  --r:16px;
  --r-sm:10px;
  --shadow:0 2px 12px rgba(13,95,163,.08);
  --shadow-lg:0 8px 32px rgba(13,95,163,.16);
}
html{background:var(--bg);height:100%}
body{
  font-family:-apple-system,'SF Pro Text','Segoe UI',Ubuntu,Cantarell,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
button{touch-action:manipulation;cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=datetime-local]{color-scheme:light}

/* ── PAGE TRANSITIONS ── */
.page{animation:fadeUp .22s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── HOME ── */
.home-wrap{min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.home-hero{padding:56px 28px 32px;position:relative;z-index:1}
.home-hero h1{
  font-size:38px;font-weight:800;letter-spacing:-1.5px;
  color:var(--navy);line-height:1.05;margin-bottom:6px;
}
.home-hero h1 span{color:var(--navy3)}
.home-hero p{font-size:14px;color:var(--text2);font-weight:500;letter-spacing:.2px}
.home-nav{padding:0 16px;display:flex;flex-direction:column;gap:10px;z-index:1;position:relative}
.nav-card{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;background:var(--surface);
  border-radius:var(--r);box-shadow:var(--shadow);
  border:1.5px solid transparent;
  text-align:left;width:100%;color:var(--text);
  transition:all .18s;
}
.nav-card:active{transform:scale(.98)}
.nav-card.primary{background:var(--navy);border-color:var(--navy)}
.nav-card.primary .nc-title{color:#fff}
.nav-card.primary .nc-sub{color:var(--navy-pale);opacity:.8}
.nav-card.primary .nc-icon{background:rgba(255,255,255,.15);color:#fff}
.nc-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg);color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.nc-body{flex:1}
.nc-title{font-size:16px;font-weight:700;display:block;margin-bottom:2px}
.nc-sub{font-size:12px;color:var(--text2)}
.nc-arrow{color:var(--text3);font-size:18px;font-weight:300}
.nav-card.primary .nc-arrow{color:rgba(255,255,255,.5)}

.home-recent{padding:20px 20px 0;z-index:1;position:relative}
.sec-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:10px}
.recent-row{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface);border-radius:var(--r-sm);
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.rr-name{font-size:14px;font-weight:600;margin-bottom:2px}
.rr-meta{font-size:11px;color:var(--text3)}
.rr-q{font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.rr-unit{font-size:11px;color:var(--text3);text-align:right}

.home-wave{margin-top:auto;position:relative;line-height:0;padding-top:40px}
.home-wave svg{width:100%;display:block}
.home-footer{background:var(--navy);padding:14px 20px 20px;text-align:center}
.home-footer p{font-size:11px;color:var(--navy-pale);opacity:.6;letter-spacing:.5px}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;background:var(--bg);
  position:sticky;top:0;z-index:20;
}
.btn-back{
  display:flex;align-items:center;gap:4px;
  color:var(--navy);font-size:15px;font-weight:600;
  padding:6px 10px;border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow);min-width:64px;
}
.btn-back svg{flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.btn-top-r{
  font-size:13px;font-weight:600;color:var(--navy);
  padding:6px 10px;border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow);min-width:64px;text-align:right;
}

.step-pips{display:flex;gap:6px;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .2s}
.pip.active{background:var(--navy);transform:scale(1.3)}
.pip.done{background:var(--navy3)}

/* ── CONTENT WRAP ── */
.cwrap{padding:8px 16px 72px}
.cwrap h2{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--navy);margin-bottom:4px}
.cwrap .sub{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.5}

/* ── FORM ELEMENTS ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:7px}
.fg .opt{text-transform:none;font-weight:400;letter-spacing:0;color:var(--text3);font-size:10px}
.inp{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:13px 14px;color:var(--text);
  font-size:15px;transition:border-color .15s;-webkit-appearance:none;
}
.inp:focus{outline:none;border-color:var(--navy3)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Weather pills */
.weather-row{display:flex;flex-wrap:wrap;gap:7px}
.w-pill{
  padding:8px 13px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:30px;font-size:12px;color:var(--text);transition:all .15s;
  white-space:nowrap;
}
.w-pill.active{border-color:var(--navy);background:var(--navy);color:#fff}

/* ── BUTTONS ── */
.btn-primary{
  background:var(--navy);color:#fff;border-radius:var(--r);
  padding:16px 24px;font-size:15px;font-weight:700;
  width:100%;transition:all .15s;letter-spacing:.1px;
  box-shadow:0 4px 16px rgba(26,58,108,.25);
}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled,.btn-primary.off{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-secondary{
  background:var(--surface);color:var(--navy);border-radius:var(--r);
  padding:14px 24px;font-size:14px;font-weight:600;
  width:100%;border:1.5px solid var(--border);transition:all .15s;
  box-shadow:var(--shadow);margin-top:8px;
}
.btn-secondary:active{transform:scale(.98)}
.btn-add-row{
  width:100%;padding:11px;border:1.5px dashed var(--navy-pale);
  border-radius:var(--r-sm);color:var(--navy3);font-size:14px;font-weight:600;
  background:none;transition:all .15s;margin:8px 0 16px;
}
.btn-add-row:active{background:rgba(74,120,190,.05)}

/* Method selector */
.method-card{
  display:flex;align-items:flex-start;gap:16px;
  padding:18px;background:var(--surface);border-radius:var(--r);
  border:2px solid var(--border);width:100%;color:var(--text);
  margin-bottom:10px;transition:all .18s;box-shadow:var(--shadow);text-align:left;
}
.method-card.active{border-color:var(--navy);background:var(--bg)}
.method-card .mi-icon{
  font-size:26px;min-width:42px;height:42px;
  background:var(--bg);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.method-card.active .mi-icon{background:var(--navy);filter:none}
.mi-body strong{display:block;font-size:16px;font-weight:700;margin-bottom:5px}
.mi-body p{font-size:13px;color:var(--text2);line-height:1.55}

/* ── SECTION CARDS ── */
.sec-card{
  background:var(--surface);border-radius:var(--r-sm);
  border:1.5px solid var(--border);margin-bottom:8px;overflow:hidden;
  box-shadow:var(--shadow);
}
.sec-card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);
}
.sec-num{
  width:24px;height:24px;border-radius:50%;background:var(--navy);
  color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.sec-del{color:var(--text3);font-size:18px;font-weight:600;padding:0 6px;transition:color .15s}
.sec-del:hover{color:var(--danger)}
.sec-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 12px}
.si-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:5px}
.s-inp{
  width:100%;background:var(--bg);border:1.5px solid var(--border);
  border-radius:8px;padding:10px 10px;color:var(--text);
  font-size:14px;-webkit-appearance:none;transition:border-color .15s;
}
.s-inp:focus{outline:none;border-color:var(--navy3)}

.svg-container{margin-bottom:14px}
.svg-ph{
  background:var(--surface);border:1.5px dashed var(--border);
  border-radius:var(--r-sm);padding:32px 16px;text-align:center;
  color:var(--text3);font-size:13px;line-height:1.6;
}

.measure-section-hdr{
  display:flex;align-items:center;gap:12px;
  margin:20px 0 12px;
}
.ms-badge{
  width:30px;height:30px;border-radius:50%;
  background:var(--navy);color:#fff;
  font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ms-badge-dim{background:var(--border);color:var(--text3)}
.ms-title{font-size:15px;font-weight:700;color:var(--navy);line-height:1.2}
.ms-sub{font-size:12px;color:var(--text3);margin-top:2px}

.vel-locked{
  background:var(--surface2);border:1.5px dashed var(--border);
  border-radius:var(--r-sm);padding:24px 20px;text-align:center;
  color:var(--text3);font-size:13px;line-height:1.6;margin-bottom:12px;
}
.vel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.vel-inp{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;padding:12px 10px;text-align:center;color:var(--text);
  font-size:15px;font-weight:600;-webkit-appearance:none;
}
.vel-inp:focus{outline:none;border-color:var(--navy3);background:var(--surface2)}

.cf-row{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px}
.cf-row:last-child{border-bottom:none}
.cf-row span{color:var(--text2)}
.cf-row strong{color:var(--success);font-weight:700}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ═══════════════════════════
   1. STORE (Local History)
═══════════════════════════ */
const Store = {
  load: () => JSON.parse(localStorage.getItem('agos-hist') || '[]'),
  save: (rec) => {
    const hist = Store.load();
    hist.unshift(rec);
    localStorage.setItem('agos-hist', JSON.stringify(hist));
  },
  del: (idx) => {
    const hist = Store.load();
    hist.splice(idx, 1);
    localStorage.setItem('agos-hist', JSON.stringify(hist));
  },
  clear: () => localStorage.removeItem('agos-hist')
};

/* ═══════════════════════════
   2. STATE MANAGEMENT
═══════════════════════════ */
function freshCalc() {
  return {
    id: 'id-' + Date.now(),
    timestamp: null,
    isSaved: false, // FIX #1: Added flag to prevent duplicate saves
    step: 'home',   
    method: 'meter',
    siteName: '',
    measuredBy: '',
    weather: 'Clear', 
    date: new Date().toISOString().slice(0, 16),
    
    // Meter Method Data
    segments: [], 
    depths: [],   
    velocities: {}, 
    
    // Float Method Data
    floater: {
      reach: '',
      width: '',
      avgDepth: '',
      cf: '0.85',
      runs: ['', '', '']
    },
    
    result: null
  };
}

const App = { calc: freshCalc() };

/* ═══════════════════════════
   3. MATH & LOGIC
═══════════════════════════ */
function avgVel(readings) {
  const vals = readings.map(parseFloat).filter(v => v > 0 && !isNaN(v));
  if (!vals.length) return NaN;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function calcMeanSection(segments, depths, velocities) {
  if (segments.length < 1 || depths.length < 2) return null;
  let totalQ = 0, totalA = 0;
  const strips = [];
  
  for (let i = 0; i < segments.length; i++) {
    const w = parseFloat(segments[i].width);
    const dL = parseFloat(depths[i]);
    const dR = parseFloat(depths[i+1]);
    const v = avgVel(velocities[segments[i].id] || []);
    
    if (isNaN(w) || w <= 0 || isNaN(dL) || dL < 0 || isNaN(dR) || dR < 0 || isNaN(v) || v < 0) return null;
    
    const avgD = (dL + dR) / 2;
    const a = w * avgD;
    const q = a * v;
    totalA += a;
    totalQ += q;
    strips.push({ i: i + 1, w, dL, dR, avgD, v, a, q });
  }
  
  if (!strips.length) return null;
  return { Q: totalQ, A: totalA, V: totalA > 0 ? totalQ / totalA : 0, strips, n: segments.length };
}

function calcFloater(f) {
  const reach = parseFloat(f.reach), width = parseFloat(f.width);
  const avgDepth = parseFloat(f.avgDepth), cf = parseFloat(f.cf);
  const runs = f.runs.map(parseFloat).filter(r => r > 0 && !isNaN(r));
  
  if (!reach || !width || !avgDepth || !cf || !runs.length) return null;
  
  const avgTime = runs.reduce((a, b) => a + b, 0) / runs.length;
  const Vs = reach / avgTime, Vm = Vs * cf, A = width * avgDepth, Q = Vm * A;
  return { Q, A, Vs, Vm, avgTime, validRuns: runs };
}

/* ═══════════════════════════
   4. SVG CROSS SECTION (FIX #5 & #6)
═══════════════════════════ */
function buildSVG(segments, depths) {
  if (!segments || !depths || depths.length < 2) return `<div class="svg-ph">Add at least 1 section with width and boundary depths to preview.</div>`;
  
  const parsedDepths = depths.map(parseFloat);
  const parsedWidths = segments.map(s => parseFloat(s.width));
  const allDepsOk = parsedDepths.every(d => !isNaN(d) && d >= 0);
  const totalW = parsedWidths.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0);
  
  if (!allDepsOk || totalW <= 0) return `<div class="svg-ph">Fill in all boundary depths and widths to see the preview.</div>`;
  
  const pts = [];
  let cumX = 0;
  for (let i = 0; i <= segments.length; i++) {
    pts.push({ x: cumX, d: parsedDepths[i] || 0 });
    if (i < segments.length) cumX += parsedWidths[i] || 0;
  }
  
  const W = 400, H = 170;
  const PL = 34, PR = 12, PT = 26, PB = 26;
  const PW = W - PL - PR, PH = H - PT - PB;
  const maxX = totalW || 1;
  const maxD = Math.max(...parsedDepths.filter(d => !isNaN(d))) || 1;
  const xPad = maxX * 0.04;
  const xMin = 0 - xPad, xRange = maxX + xPad * 2;
  const mx = x => PL + ((x - xMin) / xRange) * PW;
  const my = d => PT + (d / maxD) * PH;
  
  const profileLine = pts.map(p => `${mx(p.x).toFixed(1)},${my(p.d).toFixed(1)}`).join(' ');
  const waterPoly = [`${PL},${PT}`, ...pts.map(p => `${mx(p.x).toFixed(1)},${my(p.d).toFixed(1)}`), `${PL+PW},${PT}`].join(' ');

  let dividers = '', dots = '';
  for (let i = 1; i < pts.length - 1; i++) {
    const xPos = mx(pts[i].x);
    dividers += `<line x1="${xPos}" y1="${PT}" x2="${xPos}" y2="${my(pts[i].d)}" stroke="#BEE0F2" stroke-width="1" stroke-dasharray="4,4"/>`;
  }
  
  pts.forEach((p, i) => {
    dots += `<circle cx="${mx(p.x)}" cy="${my(p.d)}" r="3" fill="#1A7FC7"/>`;
  });

  return `
    <div style="background:var(--surface);border-radius:var(--r-sm);border:1.5px solid var(--border);padding:10px 0;overflow-x:auto;">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <text x="10" y="16" fill="#09375E" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif">River Cross-Sectional Profile</text>
        
        <polygon points="${waterPoly}" fill="#EAF4FB" opacity="0.6"/>
        <polyline points="${profileLine}" fill="none" stroke="#2B9FE0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        
        <line x1="${PL}" y1="${PT}" x2="${PL+PW}" y2="${PT}" stroke="#6DC4EC" stroke-width="1.5" stroke-dasharray="6,4"/>
        <text x="${PL+6}" y="${PT-6}" fill="#6DC4EC" font-size="10" font-weight="600" font-family="-apple-system, sans-serif">Water Surface</text>
        
        ${dividers}${dots}
        <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+PH}" stroke="#BEE0F2" stroke-width="1"/>
        <line x1="${PL}" y1="${PT+PH}" x2="${PL+PW}" y2="${PT+PH}" stroke="#BEE0F2" stroke-width="1"/>
      </svg>
    </div>
  `;
}

/* ═══════════════════════════
   5. VIEWS & HTML GENERATION
═══════════════════════════ */
const esc = s => (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// FIX #3: Added handleAction('load-hist', ${idx}) to the onclick event for history
function renderHome() {
  const hist = Store.load();
  const histHTML = hist.length ? hist.map((rec, idx) => `
    <div class="recent-row" onclick="handleAction('load-hist', ${idx})" style="cursor:pointer;">
      <div>
        <div class="rr-name">${esc(rec.siteName) || 'Unnamed Site'}</div>
        <div class="rr-meta">${new Date(rec.timestamp).toLocaleDateString()} &middot; ${rec.method === 'meter' ? 'Meter' : 'Float'}</div>
      </div>
      <div style="text-align:right">
        <div class="rr-q">${rec.result.Q.toFixed(3)}</div>
        <div class="rr-unit">m³/s</div>
      </div>
    </div>
  `).join('') : `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No saved records yet.</div>`;

  return `
    <div class="home-wrap page">
      <div class="home-hero">
        <h1>Agos<span>Calc</span></h1>
        <p>River flow calculator for off-grid sites.</p>
      </div>
      <div class="home-nav">
        <button class="nav-card primary" onclick="handleAction('new-meas')">
          <div class="nc-icon">＋</div>
          <div class="nc-body">
            <span class="nc-title">New Measurement</span>
            <span class="nc-sub">Start a flow calculation</span>
          </div>
          <div class="nc-arrow">→</div>
        </button>
      </div>
      <div class="home-recent">
        <div class="sec-hdr">Recent History</div>
        ${histHTML}
      </div>
    </div>
  `;
}

function renderDetails() {
  const c = App.calc;
  return `
    <div class="page">
      <div class="topbar">
        <button class="btn-back" onclick="handleAction('home')">← Back</button>
        <div class="step-pips"><div class="pip active"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div style="width:64px"></div>
      </div>
      <div class="cwrap">
        <h2>Site Details</h2>
        <p class="sub">Log the core details of your measurement.</p>
        
        <div class="fg">
          <label>Site Name</label>
          <input type="text" class="inp" value="${esc(c.siteName)}" onchange="App.calc.siteName=this.value" placeholder="e.g. Upper River Reach">
        </div>
        <div class="fg">
          <label>Measured By</label>
          <input type="text" class="inp" value="${esc(c.measuredBy)}" onchange="App.calc.measuredBy=this.value" placeholder="Your Name">
        </div>
        <div class="fg">
          <label>Date & Time</label>
          <input type="datetime-local" class="inp" value="${c.date}" onchange="App.calc.date=this.value">
        </div>
        <div class="fg">
          <label>Weather Condition</label>
          <div class="weather-row">
            ${['Clear', 'Cloudy', 'Drizzle', 'Rainy'].map(w => `<button class="w-pill ${c.weather===w?'active':''}" onclick="App.calc.weather='${w}';render()">${w}</button>`).join('')}
          </div>
        </div>
        <button class="btn-primary" style="margin-top:20px" onclick="App.calc.step='method';render()">Next: Select Method →</button>
      </div>
    </div>
  `;
}

function renderMethod() {
  const c = App.calc;
  return `
    <div class="page">
      <div class="topbar">
        <button class="btn-back" onclick="App.calc.step='details';render()">← Back</button>
        <div class="step-pips"><div class="pip done"></div><div class="pip active"></div><div class="pip"></div><div class="pip"></div></div>
        <div style="width:64px"></div>
      </div>
      <div class="cwrap">
        <h2>Select Method</h2>
        <p class="sub">Choose how you will measure the flow.</p>
        
        <button class="method-card ${c.method==='meter'?'active':''}" onclick="App.calc.method='meter';render()">
          <div class="mi-icon">⏚</div>
          <div class="mi-body">
            <strong>Current Meter Method</strong>
            <p>Most accurate. Divides the river into multiple sections.</p>
          </div>
        </button>
        
        <button class="method-card ${c.method==='float'?'active':''}" onclick="App.calc.method='float';render()">
          <div class="mi-icon">⚇</div>
          <div class="mi-body">
            <strong>Float Method</strong>
            <p>Simpler approach using a floating object and timed runs.</p>
          </div>
        </button>
        
        <button class="btn-primary" style="margin-top:20px" onclick="App.calc.step='setup';render()">Next: Setup Geometry →</button>
      </div>
    </div>
  `;
}

function renderSetup() {
  const c = App.calc;
  if(c.method === 'meter') {
    if(!c.segments.length) { c.segments.push({id:'s1', width:''}); c.depths=['','']; c.velocities['s1']=['','','']; }
    let segHtml = c.segments.map((s,i) => `
      <div class="sec-card">
        <div class="sec-card-hdr">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="sec-num">${i+1}</div><div style="font-size:14px;font-weight:700">Section ${i+1}</div>
          </div>
          ${c.segments.length>1 ? `<button class="sec-del" onclick="handleAction('del-seg',${i})">×</button>` : ''}
        </div>
        <div class="sec-inputs">
          <div>
            <div class="si-lbl">Width (m)</div>
            <input type="number" class="s-inp" placeholder="e.g. 1.2" value="${s.width}" onchange="App.calc.segments[${i}].width=this.value;render()">
          </div>
          <div>
            <div class="si-lbl">Depth ${i===0?'L':'R'} (m)</div>
            <input type="number" class="s-inp" placeholder="e.g. 0.5" value="${c.depths[i+1]}" onchange="App.calc.depths[${i+1}]=this.value;render()">
          </div>
        </div>
      </div>
    `).join('');
    
    return `
      <div class="page">
        <div class="topbar">
          <button class="btn-back" onclick="App.calc.step='method';render()">← Back</button>
          <div class="step-pips"><div class="pip done"></div><div class="pip done"></div><div class="pip active"></div><div class="pip"></div></div>
          <div style="width:64px"></div>
        </div>
        <div class="cwrap">
          <h2>River Geometry</h2>
          <p class="sub">Set up your cross-section width and depths.</p>
          <div class="svg-container">${buildSVG(c.segments, c.depths)}</div>
          <div style="margin-bottom:8px">
            <div class="si-lbl">Left Bank Depth (m)</div>
            <input type="number" class="s-inp" style="max-width:180px" value="${c.depths[0]}" onchange="App.calc.depths[0]=this.value;render()">
          </div>
          ${segHtml}
          <button class="btn-add-row" onclick="handleAction('add-seg')">+ Add Section</button>
          <button class="btn-primary" onclick="App.calc.step='measure';render()">Next: Measure Velocity →</button>
        </div>
      </div>
    `;
  } else {
    return `
      <div class="page">
        <div class="topbar">
          <button class="btn-back" onclick="App.calc.step='method';render()">← Back</button>
          <div class="step-pips"><div class="pip done"></div><div class="pip done"></div><div class="pip active"></div><div class="pip"></div></div>
          <div style="width:64px"></div>
        </div>
        <div class="cwrap">
          <h2>Reach Setup</h2>
          <p class="sub">Define the geometry of your straight reach.</p>
          <div class="fg"><label>Reach Length (m)</label><input type="number" class="inp" value="${c.floater.reach}" onchange="App.calc.floater.reach=this.value"></div>
          <div class="fg"><label>Average Channel Width (m)</label><input type="number" class="inp" value="${c.floater.width}" onchange="App.calc.floater.width=this.value"></div>
          <div class="fg"><label>Average Depth (m)</label><input type="number" class="inp" value="${c.floater.avgDepth}" onchange="App.calc.floater.avgDepth=this.value"></div>
          <div class="fg">
            <label>Correction Factor (α)</label>
            <select class="inp" onchange="App.calc.floater.cf=this.value">
              <option value="0.85" ${c.floater.cf==='0.85'?'selected':''}>0.85 (Normal rough bottom)</option>
              <option value="0.90" ${c.floater.cf==='0.90'?'selected':''}>0.90 (Smooth bottom)</option>
              <option value="0.80" ${c.floater.cf==='0.80'?'selected':''}>0.80 (Rocky/Rough bottom)</option>
            </select>
          </div>
          <button class="btn-primary" style="margin-top:20px" onclick="App.calc.step='measure';render()">Next: Time Floats →</button>
        </div>
      </div>
    `;
  }
}

function renderMeasure() {
  const c = App.calc;
  if(c.method === 'meter') {
    let measHtml = c.segments.map((s,i) => {
      const vels = c.velocities[s.id] || ['','',''];
      return `
        <div class="measure-section-hdr">
          <div class="ms-badge">${i+1}</div>
          <div><div class="ms-title">Section ${i+1}</div><div class="ms-sub">Width: ${s.width}m</div></div>
        </div>
        <div class="vel-grid">
          ${vels.map((v,vi) => `<input type="number" class="vel-inp" placeholder="Read ${vi+1}" value="${v}" onchange="App.calc.velocities['${s.id}'][${vi}]=this.value;render()">`).join('')}
        </div>
        <div class="vel-avg">Avg: ${avgVel(vels).toFixed(3) || '0.000'} m/s</div>
      `;
    }).join('');
    
    return `
      <div class="page">
        <div class="topbar">
          <button class="btn-back" onclick="App.calc.step='setup';render()">← Back</button>
          <div class="step-pips"><div class="pip done"></div><div class="pip done"></div><div class="pip done"></div><div class="pip active"></div></div>
          <div style="width:64px"></div>
        </div>
        <div class="cwrap">
          <h2>Velocity Readings</h2>
          <p class="sub">Log meter readings for each section.</p>
          ${measHtml}
          <button class="btn-primary" style="margin-top:24px" onclick="handleAction('calc')">Calculate Discharge</button>
        </div>
      </div>
    `;
  } else {
    return `
      <div class="page">
        <div class="topbar">
          <button class="btn-back" onclick="App.calc.step='setup';render()">← Back</button>
          <div class="step-pips"><div class="pip done"></div><div class="pip done"></div><div class="pip done"></div><div class="pip active"></div></div>
          <div style="width:64px"></div>
        </div>
        <div class="cwrap">
          <h2>Float Runs</h2>
          <p class="sub">Log the time it takes the float to travel the reach.</p>
          ${c.floater.runs.map((r,i) => `
            <div class="fg"><label>Run ${i+1} Time (seconds)</label><input type="number" class="inp" value="${r}" onchange="App.calc.floater.runs[${i}]=this.value;render()"></div>
          `).join('')}
          <button class="btn-add-row" onclick="App.calc.floater.runs.push('');render()">+ Add Run</button>
          <button class="btn-primary" style="margin-top:20px" onclick="handleAction('calc')">Calculate Discharge</button>
        </div>
      </div>
    `;
  }
}

function renderResults() {
  const c = App.calc;
  const r = c.result;
  
  const siteCard = `
    <div style="background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);">
      <h3 style="color:var(--navy);margin-bottom:6px;font-size:18px;">${esc(c.siteName) || 'Unnamed Site'}</h3>
      <div style="font-size:12px;color:var(--text2);display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <div><strong>Date:</strong> ${new Date(c.date).toLocaleDateString()}</div>
        <div><strong>By:</strong> ${esc(c.measuredBy) || '-'}</div>
        <div><strong>Weather:</strong> ${c.weather}</div>
        <div><strong>Method:</strong> ${c.method === 'meter' ? 'Meter' : 'Float'}</div>
      </div>
    </div>
  `;

  const reportSummary = `
    <div style="background:var(--navy);color:#fff;border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--shadow-lg);margin-bottom:16px;">
      <div style="font-size:13px;opacity:0.8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Total Discharge (Q)</div>
      <div style="font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;">${r.Q.toFixed(3)} <span style="font-size:16px;font-weight:600;opacity:0.8;">m³/s</span></div>
      <div style="font-size:14px;color:var(--navy-pale);opacity:0.9;">Area: ${r.A.toFixed(2)} m² &middot; Vel: ${(c.method === 'meter' ? r.V : r.Vm).toFixed(2)} m/s</div>
    </div>
  `;

  let stripsHTML = '';
  if (c.method === 'meter' && r.strips) {
    stripsHTML = `<div style="font-size:13px;font-weight:700;color:var(--text2);margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.5px;">Section Breakdown</div>`;
    r.strips.forEach((s) => {
      // FIX #7: Restore Velocity Sub-Rows
      let velocitySubRows = '';
      const segId = c.segments[s.i - 1]?.id;
      const segmentVelocities = c.velocities[segId] || [];
      
      segmentVelocities.forEach((vel, vIdx) => {
        if (vel && !isNaN(vel)) {
          velocitySubRows += `
            <div style="display:flex; justify-content:space-between; padding:4px 14px 4px 30px; font-size:12px; color:var(--text2); background:var(--surface2); border-bottom:1px solid var(--border);">
              <span>Reading ${vIdx + 1}</span>
              <span>${parseFloat(vel).toFixed(3)} m/s</span>
            </div>
          `;
        }
      });

      stripsHTML += `
        <div style="background:var(--surface);border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:8px;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);">
            <div style="font-weight:700;color:var(--navy);font-size:14px;">Section ${s.i}</div>
            <div style="font-weight:700;color:var(--success);font-size:14px;">q = ${s.q.toFixed(3)} m³/s</div>
          </div>
          <div style="display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--text);">
            <div>W: ${s.w.toFixed(2)}m &middot; D: ${s.avgD.toFixed(2)}m &middot; V: ${s.v.toFixed(3)}m/s</div>
            <div style="color:var(--text2);">A: ${s.a.toFixed(2)}m²</div>
          </div>
          ${velocitySubRows} </div>
      `;
    });
  }

  // FIX #4: Reordered Report Summary to sit BEFORE the Cross-Section
  const content = siteCard + reportSummary + (c.method === 'meter' ? buildSVG(c.segments, c.depths) : '') + stripsHTML;

  return `
    <div class="page" style="padding-bottom:80px;">
      <div class="topbar">
        <button class="btn-back" onclick="handleAction('home')">← Home</button>
        <span class="topbar-title">Report</span>
        <button class="btn-top-r" onclick="handleAction('download')">Export</button>
      </div>
      <div class="cwrap">
        <div id="report-container" style="background:var(--bg); padding-bottom:10px;">
          ${content}
        </div>
        
        <button class="btn-primary" onclick="handleAction('save')" style="margin-top:20px;">
          ${c.isSaved ? 'Saved to History ✓' : 'Save to History'}
        </button>
        <div id="save-fb" style="display:none; text-align:center; color:var(--success); font-size:13px; font-weight:600; margin-top:10px;">
          Measurement Saved Successfully!
        </div>
      </div>
    </div>
  `;
}

function render() {
  const appEl = document.getElementById('app');
  if (App.calc.step === 'home') appEl.innerHTML = renderHome();
  else if (App.calc.step === 'details') appEl.innerHTML = renderDetails();
  else if (App.calc.step === 'method') appEl.innerHTML = renderMethod();
  else if (App.calc.step === 'setup') appEl.innerHTML = renderSetup();
  else if (App.calc.step === 'measure') appEl.innerHTML = renderMeasure();
  else if (App.calc.step === 'results') appEl.innerHTML = renderResults();
}

/* ═══════════════════════════
   6. EVENT HANDLER
═══════════════════════════ */
window.handleAction = function(action, payload) {
  switch (action) {
    case 'home':
      App.calc = freshCalc();
      App.calc.step = 'home';
      render();
      break;
      
    case 'new-meas':
      App.calc = freshCalc();
      App.calc.step = 'details';
      render();
      break;

    case 'add-seg':
      const id = 's' + Date.now();
      App.calc.segments.push({id, width:''});
      App.calc.depths.push('');
      App.calc.velocities[id] = ['','',''];
      render();
      break;

    case 'del-seg':
      App.calc.segments.splice(payload, 1);
      App.calc.depths.splice(payload + 1, 1);
      render();
      break;

    case 'calc':
      if (App.calc.method === 'meter') {
        const res = calcMeanSection(App.calc.segments, App.calc.depths, App.calc.velocities);
        if (!res) return alert("Incomplete values. Make sure all widths, depths, and velocities have numbers.");
        App.calc.result = res;
      } else {
        const res = calcFloater(App.calc.floater);
        if (!res) return alert("Incomplete values. Check reach length, width, depth, and runs.");
        App.calc.result = res;
      }
      App.calc.step = 'results';
      render();
      break;

    case 'load-hist':
      const hist = Store.load();
      if (hist[payload]) {
        App.calc = hist[payload];
        App.calc.isSaved = true; // FIX #1: Prevent saving an already saved record
        App.calc.step = 'results';
        render();
      }
      break;

    case 'save':
      // FIX #1: Prevent redundant saves
      if (App.calc.isSaved) {
        alert("This measurement is already saved in history!");
        break;
      }
      
      App.calc.timestamp = Date.now();
      Store.save(App.calc);
      App.calc.isSaved = true; 
      
      const fb = document.getElementById('save-fb');
      if(fb) {
        fb.style.display = 'block';
        setTimeout(() => { if(document.getElementById('save-fb')) document.getElementById('save-fb').style.display='none'; }, 2500);
      }
      render(); 
      break;

    case 'download':
      // FIX #2: Targeted HTML2Canvas Download logic
      const reportEl = document.getElementById('report-container');
      if (!reportEl) break;
      
      const originalBg = reportEl.style.background;
      reportEl.style.background = '#FFFFFF';
      reportEl.style.padding = '16px';
      
      html2canvas(reportEl, { scale: 2, useCORS: true }).then(canvas => {
        reportEl.style.background = originalBg;
        reportEl.style.padding = '0px';
        
        const link = document.createElement('a');
        link.download = `Agos-Report-${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }).catch(err => {
        console.error("PNG export failed:", err);
        alert("Failed to export image. Check console.");
      });
      break;
  }
};

/* ═══════════════════════════
   7. INIT
═══════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  render();
});
</script>
</body>
